<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box wireframe=”true”></a-box>
      <a-box position="1 1.2 -3" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="0 1.2 -3" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="-1 1.2 -3" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="0 1.2 -4" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="1 1.2 -4" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-box position="-1 1.2 -4" rotation="0 0 0" color="#4CC3D9"></a-box>
      <a-torus position="-1 0.5 -3" rotation="0 0 0" color="black" radius="0.1"></a-torus>
      <a-torus position="1 0.5 -3" rotation="0 0 0" color="black" radius="0.1"></a-torus>
      <a-torus position="-1 0.5 -4" rotation="0 0 0" color="black" radius="0.1"></a-torus>
      <a-torus position="1 0.5 -4" rotation="0 0 0" color="black" radius="0.1"></a-torus>
      <a-tetrahedron position="2 1.2 -4" rotation="0 -75 0" color="black"></a-tetrahedron>
      <a-tetrahedron position="2 1.2 -3" rotation="0 75 0" color="black"></a-tetrahedron>
      <a-tetrahedron position="-2 1.2 -4" rotation="0 0 0" color="black"></a-tetrahedron>
      <a-tetrahedron position="-2 1.2 -3" rotation="0 45 0" color="black"></a-tetrahedron>
      
      <a-plane position="0 0 -4" rotation="-90 0 0" width="50" height="50" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
